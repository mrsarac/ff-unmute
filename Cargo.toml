[workspace]
resolver = "3"
members = ["hud", "flat", "lens"]

[workspace.dependencies]
fframes = { version = "=1.2.0", features = ["compile-time-svgtree", "cli", "h264", "libav-agree-gpl"] }
fframes_skia_renderer = { version = "=1.2.0", default-features = true }
fframes_native_player = { version = "=1.2.0", default-features = false, features = ["audio"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
